name: Format dump
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Dump formatted file
        run: |
          echo "===BEGIN==="
          dart format --output=show test/downloads_test.dart
          echo "===END==="
