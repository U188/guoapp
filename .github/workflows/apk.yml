name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all
        default: arm64-v8a

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2* 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images 2>/dev/null || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SM" ]; then echo "sdkmanager not found under $SDK"; ls -d "$SDK"/cmdline-tools/* 2>/dev/null || true; exit 1; fi
          "$SM" --version
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" 'ndk;28.2.13676358'
          ls -d "$SDK"/ndk/*
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build APK
        run: |
          ABI="${{ inputs.abi }}"
          echo "target abi: $ABI"
          if [ "$ABI" = "all" ]; then
            python scripts/build_android.py ${{ matrix.arguments }}
          else
            python scripts/build_android.py ${{ matrix.arguments }} --abi "$ABI"
          fi
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-apk
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -l artifacts
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: 预览构建，使用公共（debug）签名，未做真实站源播放验收。
          files: artifacts/*
