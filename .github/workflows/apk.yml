name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-apk
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -l artifacts
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK 0.2.51 build ${{ github.run_number }}
          body: 预览构建，使用公共（debug）签名，未做真实站源播放验收。
          files: artifacts/*
