name: Flutter check
on:
  push:
    branches: ['fix/flutter-tests']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
